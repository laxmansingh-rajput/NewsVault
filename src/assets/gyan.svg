<svg
  width="180"
  height="120"
  viewBox="0 0 180 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Light gray rounded rectangle background -->
  <rect
    x="0"
    y="0"
    width="180"
    height="120"
    rx="20"
    ry="20"
    fill="#F0F0F0"
  />

  <!-- Document shape in bright yellow with subtle shadow -->
  <rect
    x="50"
    y="20"
    width="80"
    height="80"
    rx="15"
    ry="15"
    fill="#FFD700"
    style="filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.15))"
  />

  <!-- Folded corner in a darker yellow for contrast -->
  <path
    d="M130 20 L130 50 L100 20 Z"
    fill="#E6C200"
  />

  <!-- Text lines inside document in navy blue for contrast -->
  <rect x="65" y="45" width="50" height="8" rx="4" ry="4" fill="#001F54" />
  <rect x="65" y="62" width="58" height="8" rx="4" ry="4" fill="#001F54" />
  <rect x="65" y="79" width="35" height="8" rx="4" ry="4" fill="#001F54" />
  <rect x="65" y="96" width="55" height="8" rx="4" ry="4" fill="#001F54" />
</svg>
